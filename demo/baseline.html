<!doctype html><html><head><meta charset='utf-8'><style>
body{margin:0;background:#f4f1ea;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#241f19}
#nav{position:absolute;inset:0 0 auto 0;height:64px;background:#1f2a24;color:#eef3ee;
     display:flex;align-items:center;padding:0 22px;font-weight:700;letter-spacing:.14em;
     text-transform:uppercase;font-size:13px}
#card{position:absolute;left:40px;top:96px;width:360px;padding:22px 24px;background:#fff;
      border:1px solid #e2dccf;border-radius:14px;box-shadow:0 10px 30px rgba(60,50,30,.07)}
#card h1{margin:0 0 6px;font-size:22px}
#card .price{font:700 30px/1.2 ui-monospace,monospace;color:#2f6b4a;margin:10px 0 2px}
#card .sub{color:#8a8477;font-size:13px}
#pay{position:absolute;left:40px;top:250px;width:200px;height:52px;border:0;border-radius:12px;
     background:#2f6b4a;color:#fff;font:700 15px system-ui;letter-spacing:.06em;cursor:pointer}
#panel{position:absolute;left:680px;top:250px;width:300px;height:150px;
       background:#1b2320;color:#e8efe9;border-radius:14px;padding:16px 18px;
       box-shadow:0 18px 44px rgba(20,30,24,.35)}
#panel .t{font:700 11px ui-monospace,monospace;letter-spacing:.16em;color:#8fae9a;margin-bottom:10px}
#panel .r{display:flex;justify-content:space-between;font:13px ui-monospace,monospace;padding:4px 0;
          border-bottom:1px solid rgba(255,255,255,.07)}
#panel .r b{color:#bfe6c9}
</style></head><body>
<div id="nav">visual-oracle · checkout fixture</div>
<div id="card">
  <h1>Pesanan #4821</h1>
  <div class="price">Rp 148.000</div>
  <div class="sub">2 item · kirim hari ini</div>
</div>
<button id="pay">BAYAR SEKARANG</button>
<div id="panel">
  <div class="t">LEDGER</div>
  <div class="r"><span>supply</span><b>4.812</b></div>
  <div class="r"><span>holders</span><b>37</b></div>
  <div class="r"><span>last trade</span><b>2m</b></div>
</div>
</body></html>
